<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clausemap — Capstone Deck</title>
  <meta name="description" content="Capstone presentation for Clausemap, contract-to-metric traceability." />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/deck/present.css" />
  <link rel="stylesheet" href="/deck/deck.css" />
</head>
<body>
  <main class="viewport" id="viewport" aria-live="polite">
    <div class="stage" id="stage" aria-roledescription="slide deck"></div>
  </main>

  <div class="bar" id="bar">
    <a class="bar__home" href="/" aria-label="Back to Clausemap">← Clausemap</a>
    <div class="bar__nav">
      <button type="button" id="prev" aria-label="Previous slide">‹</button>
      <span id="count" class="bar__count">1 / 1</span>
      <button type="button" id="next" aria-label="Next slide">›</button>
    </div>
    <div class="bar__tools">
      <button type="button" id="notes-btn" aria-pressed="false" title="Speaker notes (N)">Notes</button>
      <button type="button" id="full-btn" title="Full screen (F)">Full screen</button>
    </div>
  </div>

  <aside class="notes" id="notes" hidden>
    <p class="notes__label">Speaker notes · <span id="notes-slide"></span></p>
    <div class="notes__body" id="notes-body"></div>
  </aside>

  <p class="hint" id="hint">← → or Space to move · F full screen · N notes · Esc exit</p>

  <script type="module" src="/deck/present.js"></script>
</body>
</html>
