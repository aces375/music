# Cloudflare Worker with static assets.
# Files in ./public are served directly; /api/* requests run src/worker.js.
name = "clausemap"
main = "src/worker.js"
compatibility_date = "2026-11-01"

[assets]
directory = "./public"

[vars]
# Non-secret defaults. Secrets (API keys) go in .dev.vars locally and
# `wrangler secret put` / the dashboard (Settings → Variables and Secrets) in production.
NVIDIA_MODEL = "google/gemma-4-31b-it"
NVIDIA_BASE_URL = "https://integrate.api.nvidia.com/v1"
SUPABASE_URL = "https://dnjuchflztihutxyulde.supabase.co"
